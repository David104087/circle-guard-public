---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promotion-service-config
  namespace: circleguard-do-prod
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/circleguard_promotion"
  SPRING_DATASOURCE_USERNAME: "admin"
  SPRING_NEO4J_URI: "bolt://neo4j:7687"
  SPRING_NEO4J_AUTHENTICATION_USERNAME: "neo4j"
  SPRING_KAFKA_BOOTSTRAP-SERVERS: "kafka:9092"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SERVER_PORT: "8088"
  APP_NEO4J_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: promotion-service-secret
  namespace: circleguard-do-prod
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "password"
  SPRING_NEO4J_AUTHENTICATION_PASSWORD: "password"
  JWT_SECRET: "circleguard-jwt-signing-secret-key-256bit!!"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: promotion-service
  namespace: circleguard-do-prod
  labels:
    app: promotion-service
    version: "latest"
    environment: prod
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: promotion-service
  template:
    metadata:
      annotations:
        sidecar.istio.io/proxyCPU: "25m"
        sidecar.istio.io/proxyMemory: "64Mi"
        sidecar.istio.io/proxyMemoryLimit: "96Mi"
      labels:
        app: promotion-service
    spec:
      tolerations:
        - key: "node.kubernetes.io/memory-pressure"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: promotion-service
          image: davidartunduaga/circleguard-promotion:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8088
          livenessProbe:
            tcpSocket:
              port: 8088
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          envFrom:
            - configMapRef:
                name: promotion-service-config
            - secretRef:
                name: promotion-service-secret
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: promotion-service
  namespace: circleguard-do-prod
spec:
  selector:
    app: promotion-service
  ports:
    - port: 8088
      targetPort: 8088
