---
apiVersion: v1
kind: ConfigMap
metadata:
  name: form-service-config
  namespace: circleguard-do-prod
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/circleguard_form"
  SPRING_DATASOURCE_USERNAME: "admin"
  SPRING_KAFKA_BOOTSTRAP-SERVERS: "kafka:9092"
  SERVER_PORT: "8086"
---
apiVersion: v1
kind: Secret
metadata:
  name: form-service-secret
  namespace: circleguard-do-prod
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "password"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: form-service
  namespace: circleguard-do-prod
  labels:
    app: form-service
    version: "latest"
    environment: prod
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: form-service
  template:
    metadata:
      annotations:
        sidecar.istio.io/proxyCPU: "25m"
        sidecar.istio.io/proxyMemory: "64Mi"
        sidecar.istio.io/proxyMemoryLimit: "96Mi"
      labels:
        app: form-service
    spec:
      tolerations:
        - key: "node.kubernetes.io/memory-pressure"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: form-service
          image: davidartunduaga/circleguard-form:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8086
          livenessProbe:
            tcpSocket:
              port: 8086
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          envFrom:
            - configMapRef:
                name: form-service-config
            - secretRef:
                name: form-service-secret
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: form-service
  namespace: circleguard-do-prod
spec:
  selector:
    app: form-service
  ports:
    - port: 8086
      targetPort: 8086
