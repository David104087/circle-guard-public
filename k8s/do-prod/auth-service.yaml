---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: circleguard-do-prod
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/circleguard_auth"
  SPRING_DATASOURCE_USERNAME: "admin"
  SPRING_LDAP_URLS: "ldap://openldap:389"
  SPRING_LDAP_BASE: "dc=circleguard,dc=edu"
  SPRING_LDAP_USERNAME: "cn=admin,dc=circleguard,dc=edu"
  IDENTITY_SERVICE_URL: "http://identity-service:8083"
  SERVER_PORT: "8180"
  MANAGEMENT_HEALTH_LDAP_ENABLED: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: circleguard-do-prod
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "password"
  SPRING_LDAP_PASSWORD: "password"
  JWT_SECRET: "circleguard-do-prod-jwt-signing-secret-key!!"
  QR_SECRET: "circleguard-do-prod-qr-signing-secret-key!!!"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: circleguard-do-prod
  labels:
    app: auth-service
    version: "latest"
    environment: prod
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      annotations:
        sidecar.istio.io/proxyCPU: "50m"
        sidecar.istio.io/proxyMemory: "64Mi"
        sidecar.istio.io/proxyMemoryLimit: "96Mi"
      labels:
        app: auth-service
    spec:
      tolerations:
        - key: "node.kubernetes.io/memory-pressure"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: auth-service
          image: davidartunduaga/circleguard-auth:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8180
          envFrom:
            - configMapRef:
                name: auth-service-config
            - secretRef:
                name: auth-service-secret
          livenessProbe:
            tcpSocket:
              port: 8180
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 8180
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: circleguard-do-prod
spec:
  selector:
    app: auth-service
  ports:
    - port: 8180
      targetPort: 8180
