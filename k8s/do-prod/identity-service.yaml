---
apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-service-config
  namespace: circleguard-do-prod
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/circleguard_identity"
  SPRING_DATASOURCE_USERNAME: "admin"
  SERVER_PORT: "8083"
---
apiVersion: v1
kind: Secret
metadata:
  name: identity-service-secret
  namespace: circleguard-do-prod
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "password"
  JWT_SECRET: "circleguard-jwt-signing-secret-key-256bit!!"
  VAULT_SECRET: "circleguard-vault-secret"
  VAULT_SALT: "deadbeef"
  VAULT_HASH_SALT: "12345678"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: circleguard-do-prod
  labels:
    app: identity-service
    version: "latest"
    environment: prod
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      annotations:
        sidecar.istio.io/proxyCPU: "50m"
        sidecar.istio.io/proxyMemory: "64Mi"
        sidecar.istio.io/proxyMemoryLimit: "96Mi"
      labels:
        app: identity-service
    spec:
      tolerations:
        - key: "node.kubernetes.io/memory-pressure"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: identity-service
          image: davidartunduaga/circleguard-identity:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: identity-service-config
            - secretRef:
                name: identity-service-secret
          livenessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: circleguard-do-prod
spec:
  selector:
    app: identity-service
  ports:
    - port: 8083
      targetPort: 8083
