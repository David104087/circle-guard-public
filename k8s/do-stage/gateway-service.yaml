---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-service-config
  namespace: circleguard-do-stage
data:
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SERVER_PORT: "8087"
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-service-secret
  namespace: circleguard-do-stage
type: Opaque
stringData:
  JWT_SECRET: "circleguard-do-stage-jwt-signing-secret-key!!"
  QR_SECRET: "circleguard-do-stage-qr-signing-secret-key!!!"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: circleguard-do-stage
  labels:
    app: gateway-service
    version: "latest"
    environment: stage
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      annotations:
        sidecar.istio.io/proxyCPU: "25m"
        sidecar.istio.io/proxyMemory: "64Mi"
        sidecar.istio.io/proxyMemoryLimit: "96Mi"
      labels:
        app: gateway-service
    spec:
      tolerations:
        - key: "node.kubernetes.io/memory-pressure"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: gateway-service
          image: davidartunduaga/circleguard-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8087
          envFrom:
            - configMapRef:
                name: gateway-service-config
            - secretRef:
                name: gateway-service-secret
          livenessProbe:
            tcpSocket:
              port: 8087
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 8087
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: circleguard-do-stage
spec:
  selector:
    app: gateway-service
  ports:
    - port: 8087
      targetPort: 8087
