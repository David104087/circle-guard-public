# Kubecost Helm values for CircleGuard
# Tested version: 2.8.6 (2.9.x is a migration-only version — do not use)
#
# Install command:
#   helm repo add kubecost https://kubecost.github.io/cost-analyzer/ && helm repo update
#   helm install kubecost kubecost/cost-analyzer --version 2.8.6 \
#     -n kubecost --create-namespace \
#     --set global.clusterId=circleguard-dev \
#     --set kubecostProductConfigs.clusterName=circleguard-dev \
#     --set kubecostProductConfigs.currencyCode=USD \
#     --set networkCosts.enabled=false \
#     --wait --timeout=6m
#
# Access UI:
#   kubectl port-forward --namespace kubecost deployment/kubecost-cost-analyzer 9090
#   Open: http://localhost:9090  (allow ~25 min for initial metrics collection)

global:
  clusterId: circleguard-dev

  prometheus:
    # Kubecost bundles its own Prometheus when the monitoring stack isn't pre-deployed
    enabled: true

  grafana:
    enabled: false   # Kubecost ships its own Grafana; set true to disable and use existing

# GCP billing integration (requires billing export to BigQuery — see docs/operations/finops.md)
kubecostProductConfigs:
  cloudIntegrationSecret: ""   # set after billing export is configured
  currencyCode: "USD"
  clusterName: "circleguard-dev"

# Disable unused components to save resources
networkCosts:
  enabled: false   # requires DaemonSet with host networking — skip for academic env
