---
apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-service-config
  namespace: circleguard-do-dev
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/circleguard_identity"
  SPRING_DATASOURCE_USERNAME: "admin"
  SERVER_PORT: "8083"
  JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:+UseContainerSupport"
---
apiVersion: v1
kind: Secret
metadata:
  name: identity-service-secret
  namespace: circleguard-do-dev
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "password"
  JWT_SECRET: "circleguard-jwt-signing-secret-key-256bit!!"
  VAULT_SECRET: "circleguard-vault-secret"
  VAULT_SALT: "deadbeef"
  VAULT_HASH_SALT: "12345678"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: circleguard-do-dev
  labels:
    app: identity-service
    version: "latest"
    environment: dev
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
        - name: identity-service
          image: davidartunduaga/circleguard-identity:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: identity-service-config
            - secretRef:
                name: identity-service-secret
          livenessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: circleguard-do-dev
spec:
  selector:
    app: identity-service
  ports:
    - port: 8083
      targetPort: 8083
