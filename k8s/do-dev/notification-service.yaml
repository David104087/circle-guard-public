---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: circleguard-do-dev
data:
  SPRING_KAFKA_BOOTSTRAP-SERVERS: "kafka:9092"
  SPRING_MAIL_HOST: "mailhog"
  SPRING_MAIL_PORT: "1025"
  AUTH_API_URL: "http://auth-service:8180"
  SERVER_PORT: "8082"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
  JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:+UseContainerSupport"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: circleguard-do-dev
  labels:
    app: notification-service
    version: "latest"
    environment: dev
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: davidartunduaga/circleguard-notification:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          livenessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 5
          envFrom:
            - configMapRef:
                name: notification-service-config
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: circleguard-do-dev
spec:
  selector:
    app: notification-service
  ports:
    - port: 8082
      targetPort: 8082
