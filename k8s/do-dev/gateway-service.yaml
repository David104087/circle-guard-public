---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-service-config
  namespace: circleguard-do-dev
data:
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SERVER_PORT: "8087"
  JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:+UseContainerSupport"
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-service-secret
  namespace: circleguard-do-dev
type: Opaque
stringData:
  JWT_SECRET: "circleguard-do-dev-jwt-signing-secret-key!!"
  QR_SECRET: "circleguard-do-dev-qr-signing-secret-key!!!"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: circleguard-do-dev
  labels:
    app: gateway-service
    version: "latest"
    environment: dev
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: davidartunduaga/circleguard-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8087
          envFrom:
            - configMapRef:
                name: gateway-service-config
            - secretRef:
                name: gateway-service-secret
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8087
            initialDelaySeconds: 300
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8087
            initialDelaySeconds: 180
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: circleguard-do-dev
spec:
  selector:
    app: gateway-service
  ports:
    - port: 8087
      targetPort: 8087
