apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: delay-form-notification
  namespace: chaos-testing
spec:
  action: delay
  mode: one
  selector:
    namespaces:
      - circleguard-dev
    labelSelectors:
      app: form-service
  delay:
    latency: "200ms"
    correlation: "25"
    jitter: "50ms"
  direction: to
  target:
    mode: one
    selector:
      namespaces:
        - circleguard-dev
      labelSelectors:
        app: notification-service
  duration: "90s"
